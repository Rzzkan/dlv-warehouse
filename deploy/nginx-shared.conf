# Mode berbagi VPS — tambahkan sebagai vhost BARU di Nginx yang sudah melayani delova.id (tidak mengubah situs ecommerce).
# Debian/Ubuntu:  sudo cp deploy/nginx-shared.conf /etc/nginx/sites-available/wh.delova.id
#                 sudo ln -s /etc/nginx/sites-available/wh.delova.id /etc/nginx/sites-enabled/
#                 sudo nginx -t && sudo systemctl reload nginx
#                 sudo certbot --nginx -d wh.delova.id        # pasang HTTPS (certbot menambah blok 443 otomatis)
# Sesuaikan port 3100 bila APP_PORT di .env berbeda.
server {
    listen 80;
    listen [::]:80;
    server_name wh.delova.id;
    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # IP pengunjung asli (dipakai pembatas login)
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
