<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f5f55">
  <title>Delova Gudang</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div id="login" class="login hidden"></div>

  <div id="shell" class="hidden">
    <header class="topbar">
      <a class="brand" href="#/">Delova <span>Gudang</span></a>
      <nav id="nav" class="nav" aria-label="Menu utama"></nav>
      <div class="user">
        <span id="whoami"></span>
        <button id="logout" class="btn ghost sm" type="button">Keluar</button>
      </div>
    </header>
    <div id="banner"></div>
    <main id="view" class="view" tabindex="-1"></main>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="modal-root"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
